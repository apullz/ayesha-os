name: Ayesha-OS Automation Harness
 
on:
  schedule:
    # Runs every 10 minutes automatically
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub anytime
 
jobs:
  run-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Run automation harness once
        run: |
          python3 scripts/automation_harness.py --once
 
      - name: Debug git state
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "Remote URLs:"
          git remote -v
          echo "Status:"
          git status
          echo "Diff:"
          git diff --stat
      - name: Commit and push changes if any automation tasks modified files
        run: |
          git config --global user.name "ayesha-bot"
          git config --global user.email "bot@ayesha.os"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(harness): automated task execution update [skip ci]" && git push origin HEAD)
