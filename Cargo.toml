[package]
name = "ayesha-mini"
version = "0.1.0"
edition = "2021"
description = "clean minimal rust tui — chat + model picker + memory only"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
anyhow = "1"
chrono = "0.4"
