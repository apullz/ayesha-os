[package]
name = "ayesha-engine"
# Single-source of truth for the release version is ayesha.json ("version").
# Keep this in sync — the dist build and STATUS.md reference 4.5.0.
version = "4.5.0"
edition = "2021"
description = "terminal-native persona host with tool-calling for kilo"

[[bin]]
name = "ayesha-os"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
base64 = "0.22"
crossterm = { version = "0.28", features = ["event-stream"] }
anyhow = "1"
dirs = "5"
image = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3"

[build-dependencies]
